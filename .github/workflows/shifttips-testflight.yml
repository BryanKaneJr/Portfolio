name: ShiftTips TestFlight

# Builds, signs and uploads ShiftTips to TestFlight, with no Mac needed.
# Run it from the Actions tab ("Run workflow"). Setup: shifttips/docs/testflight.md

on:
  workflow_dispatch:

concurrency:
  group: shifttips-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: shifttips

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.SHIFTTIPS_BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        # App Store Connect only accepts builds made with Xcode 26 or later.
        run: |
          XCODE=$(python3 -c 'import glob, re; apps = glob.glob("/Applications/Xcode_26*.app"); print(max(apps, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if apps else "")')
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner." && exit 1; fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Check the secrets are set
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See shifttips/docs/testflight.md."
            exit 1
          fi
          xcodebuild -version

      - name: Engine tests
        run: swift test --package-path Packages/ShiftTipsKit

      - name: Write the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (signed through the API key)
        run: |
          set -o pipefail
          extra=()
          if [ -n "$BUNDLE_ID" ]; then extra+=("PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"); fi
          xcodebuild archive \
            -project ShiftTips.xcodeproj \
            -scheme ShiftTips \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ShiftTips.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${extra[@]}" \
            -quiet

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ShiftTips.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows up in App Store Connect > TestFlight once Apple finishes processing (usually 10 to 30 minutes)."

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
