# Supabase CLI config for BrainScroll (local stack + `supabase link`).
# Committed so connecting a project needs no `supabase init`. Hosted-project
# auth settings still live in the dashboard (docs/supabase-setup.md); keep the
# [auth] block below in step with them.
project_id = "brainscroll"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version (Settings → Infrastructure).
major_version = 17

[db.seed]
# Curriculum is loaded by `npm run content:import`, not SQL seeds.
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Local email catcher for sign-in codes: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
# Deep link back into the app after an OAuth sign-in (app.json scheme).
site_url = "brainscroll://"
additional_redirect_urls = ["brainscroll://auth-callback", "http://localhost:8081", "http://localhost:8081/auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Signing in with any method creates the account on first use.
enable_signup = true
# Accounts are required: BrainScroll never creates anonymous (guest) users.
# The database also refuses them (20261001000000_accounts_required.sql).
enable_anonymous_sign_ins = false
# One account per person. Supabase links Apple/Google/email identities that
# share a verified email automatically; manual linking isn't needed.
enable_manual_linking = false

[auth.rate_limit]
email_sent = 4
sms_sent = 30

# Email: one-time codes (fallback method). Templates must show {{ .Token }}.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Phone: SMS one-time codes. Needs an SMS provider (Twilio below) in hosted
# projects. Locally, test_otp numbers sign in without sending anything.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your BrainScroll code is {{ .Code }}"
max_frequency = "60s"

[auth.sms.test_otp]
15555550100 = "123456"

[auth.sms.twilio]
# Turn on once credentials exist (docs/supabase-setup.md).
enabled = false
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Sign in with Apple. Native iOS uses signInWithIdToken (the app's bundle id is
# a client id); web uses OAuth with the Services ID and a signed secret.
[auth.external.apple]
# Turn on once credentials exist (docs/supabase-setup.md).
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

# Sign in with Google. Native apps use signInWithIdToken with the web client id
# as audience; web uses OAuth. iOS Google tokens carry their own nonce.
[auth.external.google]
# Turn on once credentials exist (docs/supabase-setup.md).
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

# Subscriptions (docs/subscriptions.md). RevenueCat calls the webhook with a
# shared secret, not a Supabase session; the app calls sync-entitlement signed in.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.sync-entitlement]
verify_jwt = true
